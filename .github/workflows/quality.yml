name: quality

on:
  push:
  pull_request:

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r service/requirements.txt -r requirements-analysis.txt -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Lint and compile
        run: |
          python -m ruff check service locust scripts tests
          python -m compileall -q service locust scripts tests

  compose-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
